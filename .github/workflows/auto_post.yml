name: 24/7 Autonomous Anime Instagram Engine

on:
  schedule:
    # Runs daily at 14:30 UTC = 8:00 PM IST (peak Indian engagement time)
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Force run pipeline immediately'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  auto_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pynacl requests

      - name: Install Google Chrome & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable fonts-noto fonts-noto-cjk

      - name: Run Autonomous Anime Pipeline
        env:
          UPLOAD_POST_KEY: ${{ secrets.UPLOAD_POST_KEY }}
          UPLOAD_POST_PROFILE: ${{ secrets.UPLOAD_POST_PROFILE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python engine/run_pipeline.py

      - name: Commit and Push Logged History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add engine/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto-post): logged new publication" && git push)
